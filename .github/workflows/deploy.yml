name: Deploy to Live Server

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Frontend & Backend
        run: npm run build

  deploy:
    name: Deploy to Live Server
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Check Deployment Credentials
        id: check-secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Note: EC2_HOST or EC2_SSH_KEY is not configured in GitHub Secrets. Skipping remote SSH deploy step."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Server via SSH
        if: steps.check-secrets.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment on live server..."
            
            # 1. Navigate to deployment directory (default: ~/deployhub or custom path)
            APP_DIR="${{ secrets.PROJECT_PATH }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/deployhub"
            fi
            
            if [ ! -d "$APP_DIR" ]; then
              echo "Directory $APP_DIR does not exist. Creating it..."
              mkdir -p "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            
            # 2. Pull latest code from GitHub
            echo "📥 Pulling latest code from GitHub..."
            git fetch origin
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
            git pull origin "$CURRENT_BRANCH" || git pull origin main
            
            # 3. Install packages & build
            echo "📦 Installing dependencies & building..."
            npm ci || npm install
            npm run build
            
            # 4. Restart or reload PM2 process
            echo "♻️ Restarting application via PM2..."
            if command -v pm2 > /dev/null; then
              pm2 reload ecosystem.config.cjs || pm2 restart ecosystem.config.cjs || pm2 start ecosystem.config.cjs
              pm2 save
            else
              npx pm2 reload ecosystem.config.cjs || npx pm2 restart ecosystem.config.cjs || npx pm2 start ecosystem.config.cjs
            fi
            
            echo "✅ Live deployment completed successfully!"

