version: '3.8'

services:
  app:
    build: .
    container_name: deployhub-app
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_URL=${API_URL:-http://localhost:5000}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-pateldeeep.me}
      - MONGODB_URI=mongodb://mongodb:27017/deployhub
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-deployhub-super-secret-jwt-key-secure-32chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-deployhub-super-refresh-jwt-key-secure-32chars}
    depends_on:
      - mongodb
      - redis
    volumes:
      - storage-data:/app/storage

  mongodb:
    image: mongo:7-jammy
    container_name: deployhub-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: deployhub-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
  storage-data:
