; ==============================================================================
; DeployHub PHP-FPM Site Pool Isolation Template
; Configures secure sandboxing for hosted PHP tenant executions
; Location: /etc/php/8.2/fpm/pool.d/deployhub.conf
; ==============================================================================

[deployhub-tenant]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm-deployhub.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Execution limits
request_terminate_timeout = 30s
request_slowlog_timeout = 10s
slowlog = /var/log/php-fpm/deployhub-slow.log

; Sandboxed PHP Security Settings
; Prevent execution outside site root directory
php_admin_value[open_basedir] = /var/www/deployhub/storage/sites:/tmp
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[session.save_path] = /tmp

; Block dangerous shell execution & system functions
php_admin_value[disable_functions] = system,exec,shell_exec,passthru,proc_open,proc_close,proc_get_status,proc_nice,proc_terminate,popen,pclose,curl_multi_exec,parse_ini_file,show_source,dl

; Resource caps per request
php_admin_value[max_execution_time] = 30
php_admin_value[max_input_time] = 30
php_admin_value[memory_limit] = 64M
php_admin_value[post_max_size] = 10M
php_admin_value[upload_max_filesize] = 10M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/deployhub-error.log

